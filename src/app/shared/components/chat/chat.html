<div class="chat">
  <div #list class="chat__list">
    @for (m of messages(); track m.id) {
      <div [class]="'msg msg--' + m.from">
        @if (m.from === 'them') {
          <span class="msg__author">{{ m.author }}</span>
        }
        <p class="msg__text">{{ m.text }}</p>
      </div>
    } @empty {
      <p class="chat__empty">Saluda a tu rival.</p>
    }
  </div>

  @if (quickPhrases().length) {
    <div class="chat__quick">
      @for (phrase of quickPhrases(); track phrase) {
        <button type="button" class="quick" [disabled]="disabled()" (click)="submit(phrase); field.value = ''">{{ phrase }}</button>
      }
    </div>
  }

  <form class="chat__form" (submit)="$event.preventDefault(); submit(); field.value = ''">
    <input
      #field
      type="text"
      [maxLength]="maxLength"
      [value]="draft()"
      [disabled]="disabled()"
      (input)="draft.set($any($event.target).value)"
      placeholder="Escribe un mensaje…"
      aria-label="Mensaje"
    />
    <button type="submit" class="btn btn--icon btn--small" [disabled]="disabled() || !draft().trim()" title="Enviar">
      <app-icon name="send" />
    </button>
  </form>
</div>
